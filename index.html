<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebStray Authenticator</title>
    <script>
      (function () {
        try {
          const fs = require('fs');
          const path = require('path');

          const dataPath = nw.App.dataPath;
          const dbPath = path.join(dataPath, 'vault.db');

          let theme = 'dark';

          if (fs.existsSync(dbPath)) {
            const data = fs.readFileSync(dbPath, 'utf8');
            const lines = data.split('\n');
            const configLine = lines.findLast((line) => line.includes('settings_config'));
            if (configLine) {
              theme = JSON.parse(configLine).theme;
            }
          }

          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }

          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          console.error('Theme injection failed', e);
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
